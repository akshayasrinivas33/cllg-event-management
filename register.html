
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">CampusEvents</div>
        <nav>
            <a href="index4.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="registration">
        <h1>Event Registration</h1>
        <p>Fill in your details to participate in a college event.</p>

        <form id="registrationForm">

            <label for="name">Student Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>

            <label for="email">College Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId"
                   placeholder="Enter your student ID" required>

            <label for="department">Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical Engineering</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil Engineering</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="year">Year of Study</label>
            <select id="year" required>
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>

            <label for="event">Select Event</label>
            <select id="event" required>
                <option value="">Choose an Event</option>
                <option value="Technical Fest">Technical Fest</option>
                <option value="Cultural Fest">Cultural Fest</option>
                <option value="Sports Day">Sports Day</option>
            </select>

            <button type="submit">Submit Registration</button>

            <p id="message"></p>

        </form>
    </section>

    <footer>
        <p>© 2026 CampusEvents | College Event Management System</p>
    </footer>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value;

                document.getElementById("message").textContent =
                    "Thank you, " + name +
                    "! Your form has been submitted successfully.";

                this.reset();
            });
    </script>

</body>
</html>
