
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">CampusEvents Admin</div>
        <nav>
            <a href="index4.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="admin">
        <h1>Admin Dashboard</h1>
        <p>Manage college events from one place.</p>

        <div class="admin-cards">
            <div class="admin-card">
                <h2 id="eventCount">3</h2>
                <p>Total Events</p>
            </div>

            <div class="admin-card">
                <h2 id="registrationCount">0</h2>
                <p>Total Registrations</p>
            </div>
        </div>

        <h2>Add New Event</h2>

        <form id="eventForm">
            <label for="eventName">Event Name</label>
            <input type="text" id="eventName"
                   placeholder="Enter event name" required>

            <label for="eventDate">Event Date</label>
            <input type="date" id="eventDate" required>

            <label for="eventVenue">Venue</label>
            <input type="text" id="eventVenue"
                   placeholder="Enter venue" required>

            <label for="eventDescription">Description</label>
            <textarea id="eventDescription"
                      placeholder="Enter event description"
                      required></textarea>

            <button type="submit">Add Event</button>
        </form>

        <h2 class="event-list-title">Event List</h2>
        <div id="eventList"></div>
    </section>

    <footer>
        <p>© 2026 CampusEvents</p>
    </footer>

    <script>
        let events = [
            {
                name: "Technical Fest",
                date: "2026-10-25",
                venue: "College Auditorium",
                description: "Coding and technical competitions"
            },
            {
                name: "Cultural Fest",
                date: "2026-10-30",
                venue: "College Stage",
                description: "Music, dance and cultural activities"
            },
            {
                name: "Sports Day",
                date: "2026-11-05",
                venue: "College Ground",
                description: "Sports and team competitions"
            }
        ];

        const form = document.getElementById("eventForm");
        const list = document.getElementById("eventList");

        function displayEvents() {
            list.replaceChildren();

            document.getElementById("eventCount").textContent =
                events.length;

            events.forEach((event, index) => {
                const card = document.createElement("div");
                card.className = "admin-event-card";

                const title = document.createElement("h3");
                title.textContent = event.name;

                const date = document.createElement("p");
                date.textContent = "Date: " + event.date;

                const venue = document.createElement("p");
                venue.textContent = "Venue: " + event.venue;

                const description = document.createElement("p");
                description.textContent = event.description;

                const remove = document.createElement("button");
                remove.type = "button";
                remove.textContent = "Delete Event";

                remove.addEventListener("click", () => {
                    events.splice(index, 1);
                    displayEvents();
                });

                card.append(title, date, venue, description, remove);
                list.appendChild(card);
            });
        }

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            events.push({
                name: document.getElementById("eventName").value,
                date: document.getElementById("eventDate").value,
                venue: document.getElementById("eventVenue").value,
                description:
                    document.getElementById("eventDescription").value
            });

            form.reset();
            displayEvents();
        });

        displayEvents();
    </script>

</body>
</html>
